name: Elérhetőségi teszt

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  teszt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python teszt/elerhetoseg.py
      - name: Eredmény mentése a repóba
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add teszt/eredmeny.json teszt/eredmeny.md
          git commit -m "Elérhetőségi teszt eredménye" || echo "nincs változás"
          git push

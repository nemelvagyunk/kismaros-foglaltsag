name: Napi foglaltságmérés

on:
  schedule:
    - cron: "17 3 * * *"   # minden nap 03:17 UTC (Budapesten 04:17 / nyáron 05:17)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: napi-meres
  cancel-in-progress: false

jobs:
  meres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mérés (60 nap előre)
        run: python futtat.py --napok 60
      - name: Adatok mentése a repóba
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add adatok
          git commit -m "Napi mérés $(TZ=Europe/Budapest date +%F)" || echo "nincs változás"
          git pull --rebase --quiet || true
          git push

name: Napi foglaltságmérés

on:
  schedule:
    # A napi mérést 04:17-kor (budapesti idő) egy Claude ütemezett feladat indítja (workflow_dispatch, forras=claude),
    # mert a GitHub saját időzítője az új repóknál órákat késik vagy kimarad (2026. 11.).
    # Az alábbi két GitHub-időpont csak tartalék: akkor mér, ha aznap még nincs mérés.
    - cron: "17 3 * * *"
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      forras:
        description: "Ki indította (claude / kezi)"
        required: false
        default: "kezi"

permissions:
  contents: write

concurrency:
  group: napi-meres
  cancel-in-progress: false

jobs:
  meres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Kell-e mérni? (és a teszt naplója)
        id: kell
        run: |
          NAP=$(TZ=Europe/Budapest date +%F)
          IDO=$(date -u +%H:%M)
          ESEMENY="${{ github.event_name }}"
          CRON="${{ github.event.schedule }}"
          if [ "$ESEMENY" = "schedule" ]; then TIPUS="github-idozito ($CRON)"; else TIPUS="${{ inputs.forras || 'kezi' }}"; fi
          [ -f adatok/inditasok.csv ] || echo "nap;tipus;inditas_utc;teendo" > adatok/inditasok.csv
          if [ "$ESEMENY" = "schedule" ] && [ -f "adatok/naplo/$NAP.json" ]; then
            echo "meres=nem" >> "$GITHUB_OUTPUT"
            echo "$NAP;$TIPUS;$IDO;kihagyva (a mai mérés már megvan)" >> adatok/inditasok.csv
            echo "GitHub-időzítő: a mai mérés már megvan, kihagyva." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "meres=igen" >> "$GITHUB_OUTPUT"
            echo "$NAP;$TIPUS;$IDO;mérés" >> adatok/inditasok.csv
          fi
      - uses: actions/setup-python@v5
        if: steps.kell.outputs.meres == 'igen'
        with:
          python-version: "3.12"
      - name: Mérés (60 nap előre)
        if: steps.kell.outputs.meres == 'igen'
        run: python futtat.py --napok 60
      - name: Adatok mentése a repóba
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add adatok
          git commit -m "Napi mérés $(TZ=Europe/Budapest date +%F) (${{ steps.kell.outputs.meres == 'igen' && 'mérés' || 'időzítő kihagyva' }})" || echo "nincs változás"
          git pull --rebase --quiet || true
          git push
